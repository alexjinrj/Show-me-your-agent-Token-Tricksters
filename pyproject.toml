[project]
name = "business-coordinator"
version = "0.1.0"
description = "Canonical domain and process contracts for the SME Business State Coordinator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "simpy>=4.1,<5",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.2,<2027; sys_platform == 'win32'",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/core",
  "src/load_data",
  "src/enterprise_state",
  "src/tools",
  "src/agent_runtime",
  "src/interfaces",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
