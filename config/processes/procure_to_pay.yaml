schema_version: 2
process_id: procure_to_pay
version: 2
label: Procure to Pay
primary_object_type: purchase_order
active_statuses: [open]
initial_activity_id: evaluate_reorder
terminal_activity_ids: [pay_supplier]

activities:
  - id: evaluate_reorder
    kind: activity
    label: Evaluate Reorder
    inputs:
      - {alias: subject, object_type: purchase_order, source: subject}
    duration: {kind: fixed, hours: 0.5}
    operations:
      - {operation: set, target: subject.status, value: approved}
    on_complete: {event_type: reorder_approved, references: [subject]}
    operational_metrics: [inventory_quantity, exception_count, backlog_count]
    next: [{target: place_purchase_order}]

  - id: place_purchase_order
    kind: activity
    label: Place Purchase Order
    inputs:
      - {alias: subject, object_type: purchase_order, source: subject}
    resource: purchasing_staff
    duration: {kind: fixed, hours: 1.0}
    operations:
      - {operation: set, target: subject.status, value: ordered}
    on_start: {event_type: purchase_order_entered_simulation, references: [subject]}
    on_complete: {event_type: purchase_order_placed, references: [subject]}
    operational_metrics: [object_count, total_quantity, total_monetary_value]
    next: [{target: wait_for_supplier_delivery}]

  - id: wait_for_supplier_delivery
    kind: activity
    label: Wait for Supplier Delivery
    inputs:
      - {alias: subject, object_type: purchase_order, source: subject}
    duration: {kind: until_field, field: subject.due_at}
    on_start: {event_type: supplier_delivery_scheduled, references: [subject]}
    on_complete: {event_type: supplier_delivery_arrived, references: [subject]}
    operational_metrics: [backlog_count, average_waiting_time, exception_count]
    next: [{target: receive_goods}]

  - id: receive_goods
    kind: activity
    label: Receive Goods
    inputs:
      - {alias: subject, object_type: purchase_order, source: subject}
      - alias: inventory
        object_type: inventory_position
        source: related
        match_field: sku
        value_from: subject.sku
    resource: warehouse_staff
    duration: {kind: fixed, hours: 1.0}
    operations:
      - {operation: increase, target: inventory.quantity_on_hand, value_from: subject.quantity}
      - {operation: increase, target: inventory.quantity_available, value_from: subject.quantity}
      - {operation: set, target: subject.status, value: received}
    on_complete: {event_type: goods_received, references: [subject, inventory]}
    operational_metrics: [inventory_quantity, total_quantity, resource_utilization]
    financial_effects:
      - event: goods_received
        debit_account: inventory
        credit_account: goods_received_not_invoiced
        amount_basis: supplier_invoice_amount
    next: [{target: record_supplier_invoice}]

  - id: record_supplier_invoice
    kind: activity
    label: Record Supplier Invoice
    inputs:
      - {alias: subject, object_type: purchase_order, source: subject}
    resource: finance_staff
    duration: {kind: fixed, hours: 0.5}
    operations:
      - {operation: set, target: subject.status, value: invoiced}
    on_complete: {event_type: supplier_invoice_recorded, references: [subject]}
    operational_metrics: [accounts_payable, total_monetary_value]
    financial_effects:
      - event: supplier_invoice_recorded
        debit_account: goods_received_not_invoiced
        credit_account: accounts_payable
        amount_basis: supplier_invoice_amount
    next: [{target: pay_supplier}]

  - id: pay_supplier
    kind: activity
    label: Pay Supplier
    inputs:
      - {alias: subject, object_type: purchase_order, source: subject}
    duration: {kind: parameter, parameter: supplier_payment_terms_hours}
    operations:
      - {operation: set, target: subject.status, value: paid}
    on_complete: {event_type: supplier_paid, references: [subject]}
    operational_metrics: [cash, accounts_payable, object_count]
    financial_effects:
      - event: supplier_paid
        debit_account: accounts_payable
        credit_account: cash
        amount_basis: payment_amount
    next: []

parameters:
  supplier_payment_terms_hours: 336
