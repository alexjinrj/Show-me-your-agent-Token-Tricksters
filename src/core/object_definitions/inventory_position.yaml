object_type: inventory_position
schema_version: 1
identity: [sku, warehouse_id]
attributes:
  item_id: {type: string, mutable: false}
  sku: {type: string, required: true, mutable: false}
  warehouse: {type: string}
  warehouse_id: {type: string, required: true}
  quantity: {type: decimal, minimum: 0}
  quantity_on_hand: {type: decimal, required: true, minimum: 0}
  quantity_reserved: {type: decimal, required: true, minimum: 0}
  quantity_available: {type: decimal, required: true, minimum: 0}
  source_system: {type: string, mutable: false}
  source_file_id: {type: string, mutable: false}
  source_record_id: {type: string, mutable: false}
  ingestion_run_id: {type: string, mutable: false}
  business_timestamp: {type: datetime, mutable: false}
  mapping_version: {type: string, mutable: false}
  validation_status: {type: string, mutable: false}
  data_origin: {type: string, mutable: false}
